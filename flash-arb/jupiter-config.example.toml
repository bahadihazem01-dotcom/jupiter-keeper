# ============================================================
# Jupiter Self-Hosted API Server — Configuration
# ============================================================
#
# NotArb runs its own Jupiter API server for finding arb routes.
# This eliminates rate limits and third-party dependencies.
#
# Start with: bash start-jupiter.sh

[jupiter]
# Your RPC endpoint — same Helius key as bot-config.toml
# Replace YOUR_HELIUS_API_KEY with your actual key
rpc_url="https://mainnet.helius-rpc.com/?api-key=YOUR_HELIUS_API_KEY"

# Port for the Jupiter API server
port=8080

# Auto-restart if Jupiter crashes
auto_restart=true
auto_restart_delay_seconds=5

# Timed restart interval (keeps things fresh)
# Set to 0 to disable
timed_restart_minutes=60

# ---- Mint Filters ----
# Only load markets for tokens you're trading (saves RAM + startup time)

[dynamic_filter]
enabled=true  # Fetches tradable tokens from Jupiter's API

[static_filter]
enabled=true
mints=[
