# ============================================================
# Kora Paymaster Configuration — Optimized for Cost Efficiency
# ============================================================
#
# This config is tuned for earning USDC revenue:
# - You pay gas in SOL (ultra cheap: ~$0.00085/tx)
# - Users pay YOU in USDC for the gas fee + your margin
# - Token accounts (ATAs) are auto-created by Kora on first use
# - No need to pre-fund USDC accounts — Kora handles it

[kora]
# Rate limiting: max requests per second
# Start conservative, increase as you scale
rate_limit = 50

[kora.auth]
# Uncomment to require API key (recommended for production)
# api_key = "your-secret-api-key-here"

[kora.lighthouse]
# Fee payer protection — prevents drainage attacks
enabled = false
fail_if_transaction_size_overflow = true

[kora.cache]
# Enable Redis caching for better performance
# Set to true and configure url if using Redis
enabled = false
url = "redis://redis:6379"
default_ttl = 300
account_ttl = 60

[kora.enabled_methods]
liveness = true
estimate_transaction_fee = true
get_supported_tokens = true
sign_transaction = true
sign_and_send_transaction = true
transfer_transaction = true
get_blockhash = true
get_config = true
get_payer_signer = true
get_version = true

# ============================================================
# Validation — Controls what transactions the Paymaster accepts
# ============================================================
[validation]
# Max lamports the fee payer can spend per transaction
# Keep this low to prevent abuse
max_allowed_lamports = 5000000  # ~0.005 SOL — covers gas + ATA creation (~0.002 SOL each)
max_signatures = 10
price_source = "Jupiter"  # Real-time pricing for USDC fee conversion
allow_durable_transactions = false

# Programs allowed in transactions the Paymaster will sign
# These cover: basic transfers, token operations, Jupiter swaps, Raydium, etc.
allowed_programs = [
    "11111111111111111111111111111111",              # System Program
    "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA",   # Token Program
    "ATokenGPvbdGVxr1b2hvZbsiqW5xWH25efTNsLJA8knL",  # Associated Token Program
    "AddressLookupTab1e1111111111111111111111111",   # Address Lookup Table Program
    "ComputeBudget111111111111111111111111111111",   # Compute Budget Program
    "JUP6LkbZbjS1jKKwapdHNy74zcZ3tLUZoi5QNyVTaV4",  # Jupiter v6
    "whirLbMiicVdio4qvUfM5KAg6Ct8VwpYzGff3uctyCc",  # Orca Whirlpool
]

# Tokens accepted for fee payment — users pay gas in USDC, you keep the margin
allowed_tokens = [
    "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v", # USDC
]

# SPL tokens that can be used in paid transactions
allowed_spl_paid_tokens = [
    "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v", # USDC
]

disallowed_accounts = []

# ============================================================
# Fee Payer Policy — Restrict what the fee payer can do
# Lock this down to prevent abuse
# ============================================================
[validation.fee_payer_policy]

[validation.fee_payer_policy.system]
allow_transfer = false          # Don't let txs drain the fee payer via system transfers
allow_assign = false
allow_create_account = true     # Allow ATA creation (needed for token ops)
allow_allocate = false

[validation.fee_payer_policy.system.nonce]
allow_initialize = false
allow_advance = false
allow_authorize = false
allow_withdraw = false

[validation.fee_payer_policy.spl_token]
allow_transfer = false          # Don't let txs drain the fee payer's tokens
allow_burn = false
allow_close_account = false
allow_approve = false
allow_revoke = false
allow_set_authority = false
allow_mint_to = false
allow_initialize_mint = false
allow_initialize_account = true # Allow ATA initialization
allow_initialize_multisig = false
allow_freeze_account = false
allow_thaw_account = false

[validation.fee_payer_policy.token_2022]
allow_transfer = false
allow_burn = false
allow_close_account = false
allow_approve = false
allow_revoke = false
allow_set_authority = false
allow_mint_to = false
allow_initialize_mint = false
allow_initialize_account = true
allow_initialize_multisig = false
allow_freeze_account = false
allow_thaw_account = false

[validation.fee_payer_policy.alt]
allow_create = false
allow_extend = false
allow_freeze = false
allow_deactivate = false
allow_close = false

# ============================================================
# Pricing — YOUR revenue model
# ============================================================
[validation.price]
# "margin" = charge gas cost + X% margin (your profit in USDC)
# Users pay USDC, you keep the 10% margin on top of gas costs
type = "margin"
margin = 0.1   # 10% margin = your cut in USDC

[validation.token_2022]
transfer_hook_policy = "deny_mutable_for_delayed_signing"
blocked_mint_extensions = []
blocked_account_extensions = []

# ============================================================
# Metrics — Monitor your costs and revenue
# ============================================================
[metrics]
enabled = true
endpoint = "/metrics"
port = 8080
scrape_interval = 60

[metrics.fee_payer_balance]
enabled = true
expiry_seconds = 30

# ============================================================
# Usage Limits — Prevent abuse
# ============================================================
[kora.usage_limit]
enabled = false
fallback_if_unavailable = true

[kora.plugins]
enabled = []

[kora.bundle]
enabled = false

[kora.bundle.jito]
block_engine_url = "https://mainnet.block-engine.jito.wtf"
